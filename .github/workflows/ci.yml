name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ai-job-search-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Validate framework and CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint skills and commands
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          python tools/lint_skills.py
          python tools/check_framework_version.py

      - name: Run security guards
        run: python tools/security_guards.py

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Check workspace setup
        run: |
          pnpm install --frozen-lockfile
          pnpm run check

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Type-check and test every portal CLI
        run: |
          set -euo pipefail
          found=0
          for cli in .agents/skills/*/cli; do
            [ -f "$cli/package.json" ] || continue
            found=1
            echo "::group::$cli"
            (
              cd "$cli"
              bun install
              bun run typecheck
              if find tests -type f -name '*.test.ts' 2>/dev/null | grep -q .; then
                bun test
              else
                echo "Không có test fixture; bỏ qua."
              fi
            )
            echo "::endgroup::"
          done
          test "$found" -eq 1 || { echo "::error::Không tìm thấy portal CLI nào."; exit 1; }

      - name: Backend - build and lint
        working-directory: server
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prisma generate
          pnpm run lint
          pnpm run build

  security-scan:
    name: Scan repository vulnerabilities
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          format: table
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"

  docker-build:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}/server:${{ github.ref_name }}
            ghcr.io/${{ env.IMAGE_NAME }}/server:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_NAME }}/server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/dev'
    environment: development
    steps:
      - name: Validate deployment configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          test -n "$DEPLOY_HOST" || { echo "::error::Missing DEPLOY_HOST secret."; exit 1; }
          test -n "$DEPLOY_USER" || { echo "::error::Missing DEPLOY_USER secret."; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo "::error::Missing DEPLOY_SSH_KEY secret."; exit 1; }
          test -n "$DEPLOY_PATH" || { echo "::error::Missing DEPLOY_PATH variable."; exit 1; }

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ github.ref_name }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_PATH,IMAGE_NAME,IMAGE_TAG
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            git fetch --prune origin
            git reset --hard "origin/$IMAGE_TAG"
            cd server
            test -f .env || { echo "::error::Thieu server/.env tren may chu."; exit 1; }
            export GITHUB_REPOSITORY="$IMAGE_NAME"
            export IMAGE_TAG="$IMAGE_TAG"
            docker compose pull app postgres
            docker image inspect aijob-latex >/dev/null 2>&1 || docker compose build latex
            docker image inspect aijob-pdf >/dev/null 2>&1 || docker compose build pdf
            docker compose --profile migrate run --rm migrate
            docker compose up -d --remove-orphans
            docker image prune -f
