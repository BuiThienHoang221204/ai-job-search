name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The workflow only reads repository content.  No images are published and no
# deployment target is configured for this repository.
permissions:
  contents: read

concurrency:
  group: ai-job-search-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Validate framework and CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Lint skills and commands
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          python tools/lint_skills.py
          python tools/check_framework_version.py

      - name: Run security guards
        run: python tools/security_guards.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Check workspace setup
        run: |
          pnpm install --frozen-lockfile
          pnpm run check

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      # Duyệt mọi portal CLI thay vì liệt kê từng cái: thêm portal mới bằng
      # /add-portal sẽ được kiểm tra mà không phải sửa workflow này.
      - name: Type-check and test every portal CLI
        run: |
          set -euo pipefail
          found=0
          for cli in .agents/skills/*/cli; do
            [ -f "$cli/package.json" ] || continue
            found=1
            echo "::group::$cli"
            (
              cd "$cli"
              bun install
              bun run typecheck
              if find tests -type f -name '*.test.ts' 2>/dev/null | grep -q .; then
                bun test
              else
                echo "Không có test fixture; bỏ qua."
              fi
            )
            echo "::endgroup::"
          done
          test "$found" -eq 1 || { echo "::error::Không tìm thấy portal CLI nào - cây thư mục đã đổi chỗ."; exit 1; }

      - name: Backend - build and unit tests
        working-directory: server
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prisma generate
          pnpm run lint
          pnpm run build
          pnpm test

  security-scan:
    name: Scan repository vulnerabilities
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          format: table
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"

  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    needs: security-scan
    # Deploy production only after a successful push to the main branch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Validate deployment configuration
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_DEPLOY_PATH: ${{ vars.DO_DEPLOY_PATH }}
        run: |
          test -n "$DO_HOST" || { echo "::error::Missing DO_HOST secret."; exit 1; }
          test -n "$DO_USER" || { echo "::error::Missing DO_USER secret."; exit 1; }
          test -n "$DO_SSH_KEY" || { echo "::error::Missing DO_SSH_KEY secret."; exit 1; }
          test -n "$DO_DEPLOY_PATH" || { echo "::error::Missing DO_DEPLOY_PATH repository variable."; exit 1; }

      - name: Sync source code to DigitalOcean
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_PATH: ${{ vars.DO_DEPLOY_PATH }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          envs: DEPLOY_PATH,REPOSITORY,COMMIT_SHA,GITHUB_TOKEN
          script: |
            set -euo pipefail
            case "$DEPLOY_PATH" in
              /*) ;;
              *) echo "DEPLOY_PATH must be an absolute path."; exit 1 ;;
            esac
            AUTH_REPOSITORY="https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git"
            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              mkdir -p "$(dirname "$DEPLOY_PATH")"
              git clone --depth 1 "$AUTH_REPOSITORY" "$DEPLOY_PATH"
            fi
            git -C "$DEPLOY_PATH" fetch --depth 1 "$AUTH_REPOSITORY" "$COMMIT_SHA"
            git -C "$DEPLOY_PATH" checkout --detach --force FETCH_HEAD
            git -C "$DEPLOY_PATH" remote set-url origin "https://github.com/${REPOSITORY}.git"
