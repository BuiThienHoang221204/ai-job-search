# Usage:
#   Development: docker compose --env-file .env.development up -d
#   Production:  docker compose --env-file .env.production up -d

name: ai-job-search

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/${GITHUB_REPOSITORY:-buithienhoang221204/ai-job-search}/server:${IMAGE_TAG:-latest}
    container_name: aijob-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => 1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  postgres:
    image: pgvector/pgvector:pg17
    container_name: aijob-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aijob
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aijob_dev_password}
      POSTGRES_DB: aijob
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aijob -d aijob"]
      interval: 5s
      timeout: 5s
      retries: 10

  latex:
    image: aijob-latex
    container_name: aijob-latex
    restart: unless-stopped
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"

  pdf:
    image: aijob-pdf
    container_name: aijob-pdf
    restart: unless-stopped
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"

volumes:
  postgres_data:
