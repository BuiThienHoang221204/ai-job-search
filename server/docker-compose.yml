# Usage:
#   Development: docker compose --env-file .env.development up -d
#   Production:  docker compose --env-file .env.production up -d

name: ai-job-search

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ghcr.io/${GITHUB_REPOSITORY:-buithienhoang221204/ai-job-search}/server:${IMAGE_TAG:-latest}
    container_name: aijob-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const p = process.env.PORT || 4000; fetch('http://127.0.0.1:' + p + '/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  migrate:
    profiles: ["migrate"]
    image: ghcr.io/${GITHUB_REPOSITORY:-buithienhoang221204/ai-job-search}/server:${IMAGE_TAG:-latest}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]

  postgres:
    image: pgvector/pgvector:pg17
    container_name: aijob-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aijob
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aijob_dev_password}
      POSTGRES_DB: aijob
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data_pgvector:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aijob -d aijob"]
      interval: 5s
      timeout: 5s
      retries: 10

  omniroute:
    image: diegosouzapw/omniroute:3.8.49
    container_name: aijob-omniroute
    restart: unless-stopped
    expose:
      - "20128"
    ports:
      - "127.0.0.1:20128:20128"
    environment:
      PORT: 20128
      NODE_ENV: production
      DATA_DIR: /data
      JWT_SECRET: ${OMNIROUTE_JWT_SECRET}
      API_KEY_SECRET: ${OMNIROUTE_KEY_SECRET}
      INITIAL_PASSWORD: ${OMNIROUTE_PASSWORD}
      DISABLE_SQLITE_AUTO_BACKUP: "true"
    volumes:
      - omniroute_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:20128/v1/models').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G

  latex:
    image: aijob-latex
    container_name: aijob-latex
    restart: unless-stopped
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"

  pdf:
    image: aijob-pdf
    container_name: aijob-pdf
    restart: unless-stopped
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"

volumes:
  postgres_data_pgvector:
  omniroute_data:
