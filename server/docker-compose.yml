# Một file `.env` trong thư mục này phục vụ HAI việc, nên không cần `--env-file`:
# `env_file` nạp biến vào trong container, còn Compose tự đọc cùng file đó để thay
# `${POSTGRES_PASSWORD}` và `${OMNIROUTE_*}` bên dưới.
#
#   docker compose up -d
#
# `latex`, `pdf`, `omniroute`, `opencode` và `laya` build tại chỗ vì không có trên
# registry nào, mỗi dịch vụ một thư mục riêng ngang hàng `server/`.
#
# Chỉ `laya` và `migrate` còn nằm sau profile; số còn lại lên theo `up -d`. Lưu ý
# `app` cũng không có profile và nó giữ cổng 3000 - đúng cổng dev server chạy trên
# host, nên khi dev hãy gọi tên service thay vì `up -d` trần.
#
# `MODEL_PROVIDER` mặc định là `omniroute` (khai trong `configuration.ts`, không
# phải ở `.env`), nhưng lõi mặc định CHỈ áp cho model id không có tiền tố - mà
# chuỗi hiện tại thì mắt xích nào cũng có tiền tố lõi.

name: ai-job-search

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ghcr.io/${GITHUB_REPOSITORY:-buithienhoang221204/ai-job-search}/server:${IMAGE_TAG:-latest}
    container_name: aijob-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    networks:
      - default
      - opencode
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const p = process.env.PORT || 4000; fetch('http://127.0.0.1:' + p + '/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  migrate:
    profiles: ["migrate"]
    image: ghcr.io/${GITHUB_REPOSITORY:-buithienhoang221204/ai-job-search}/server:${IMAGE_TAG:-latest}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]

  postgres:
    image: pgvector/pgvector:pg17
    container_name: aijob-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aijob
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aijob_dev_password}
      POSTGRES_DB: aijob
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data_pgvector:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aijob -d aijob"]
      interval: 5s
      timeout: 5s
      retries: 10

  omniroute:
    build:
      context: ../omniroute-service
    image: aijob-omniroute:latest
    container_name: aijob-omniroute
    restart: unless-stopped
    shm_size: "1gb"
    expose:
      - "20128"
    ports:
      - "127.0.0.1:20128:20128"
    environment:
      PORT: 20128
      NODE_ENV: production
      DATA_DIR: /data
      JWT_SECRET: ${OMNIROUTE_JWT_SECRET}
      API_KEY_SECRET: ${OMNIROUTE_KEY_SECRET}
      INITIAL_PASSWORD: ${OMNIROUTE_PASSWORD}
      DISABLE_SQLITE_AUTO_BACKUP: "true"
      PLAYWRIGHT_BROWSERS_PATH: /app/ms-playwright
      # Hạn THỰC THI sau dispatch, không phải hạn xếp hàng; trần UI là 30000ms nên đừng lưu ở Settings → Resilience.
      RATE_LIMIT_MAX_WAIT_MS: "90000"
    volumes:
      - omniroute_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:20128/v1/models').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 3G

  latex:
    image: aijob-latex
    build:
      context: ../latex-service
    container_name: aijob-latex
    restart: unless-stopped
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"

  pdf:
    image: aijob-pdf
    build:
      context: ../pdf-service
    container_name: aijob-pdf
    restart: unless-stopped
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"

  laya:
    profiles: ["laya"]
    image: aijob-laya
    build:
      context: ../laya-service
    container_name: aijob-laya
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      LAYA_DEVICE: ${LAYA_DEVICE:-cpu}
      LAYA_MODEL: ${LAYA_MODEL:-multilingual}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 5G
          cpus: "4"

  # Mạng riêng `opencode`: container này chạy LLM còn nguyên tool bash/read.
  opencode:
    image: aijob-opencode
    build:
      context: ../opencode-service
    container_name: aijob-opencode
    restart: unless-stopped
    expose:
      - "8080"
    # Chỉ loopback: app chạy trên host bằng pnpm không với tới mạng `opencode` được.
    ports:
      - "127.0.0.1:8091:8080"
    networks:
      - opencode
    read_only: true
    tmpfs:
      - /tmp
      - /work
    volumes:
      - opencode_data:/home/opencode/.local/share/opencode
    environment:
      OPENCODE_MAX_CONCURRENCY: "2"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"

volumes:
  postgres_data_pgvector:
  omniroute_data:
  opencode_data:

networks:
  default:
  opencode:
